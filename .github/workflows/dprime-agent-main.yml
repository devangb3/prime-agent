name: DPrime Agent Main Binary

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dprime-agent-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Build standalone binary
        run: ./scripts/build-binaries.sh --skip-deps --platform linux-x64

      - name: Smoke test standalone binary
        run: packages/coding-agent/binaries/linux-x64/pi --help

      - name: Check
        run: npm run check

      - name: Package DPrime Agent
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          release_dir="$RUNNER_TEMP/dprime-agent-release"
          package_dir="$release_dir/dprime-agent"
          archive_name="dprime-agent-linux-x64-${BUILD_SHA}.tar.gz"

          mkdir -p "$package_dir/dist"
          cp -a packages/coding-agent/binaries/linux-x64/. "$package_dir/"
          cp -a packages/coding-agent/dist/prime-agent-runtime "$package_dir/dist/"
          mv "$package_dir/pi" "$package_dir/dprime-agent"
          chmod 0755 "$package_dir/dprime-agent"

          tar -czf "$release_dir/$archive_name" -C "$release_dir" dprime-agent
          archive_sha256=$(sha256sum "$release_dir/$archive_name" | awk '{print $1}')
          printf 'commit=%s\narchive=%s\nsha256=%s\n' \
            "$BUILD_SHA" "$archive_name" "$archive_sha256" \
            > "$release_dir/dprime-agent-main.env"

          echo "RELEASE_DIR=$release_dir" >> "$GITHUB_ENV"
          echo "ARCHIVE_NAME=$archive_name" >> "$GITHUB_ENV"

      - name: Publish moving main release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: dprime-agent-main
        run: |
          printf 'Latest verified DPrime Agent standalone build from `main` at `%s`.\n' \
            "$GITHUB_SHA" > "$RUNNER_TEMP/dprime-agent-release-notes.md"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "DPrime Agent main" \
              --notes-file "$RUNNER_TEMP/dprime-agent-release-notes.md" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "DPrime Agent main" \
              --notes-file "$RUNNER_TEMP/dprime-agent-release-notes.md" \
              --prerelease
          fi

          gh release upload "$RELEASE_TAG" "$RELEASE_DIR/$ARCHIVE_NAME" --clobber
          gh release upload "$RELEASE_TAG" "$RELEASE_DIR/dprime-agent-main.env" --clobber

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
              -F sha="$GITHUB_SHA" \
              -F force=true >/dev/null
          fi

          release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .id)
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" \
            --jq ".[] | select(.name != \"$ARCHIVE_NAME\" and .name != \"dprime-agent-main.env\") | .id" |
            while read -r asset_id; do
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            done
