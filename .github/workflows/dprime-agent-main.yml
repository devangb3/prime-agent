name: DPrime Agent Main Package

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dprime-agent-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish Node package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Node packages
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test kernel transport
        run: npm run test:kernel --workspace @earendil-works/pi-coding-agent

      - name: Pack DPrime Agent
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          release_dir="$RUNNER_TEMP/dprime-agent-release"
          pack_dir="packages/coding-agent/release/dprime-main"
          release_base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/dprime-agent-main"
          package_version=$(node -p "require('./package.json').version")
          package_version="${package_version}-main.${GITHUB_RUN_NUMBER}.${BUILD_SHA::7}"

          PRIME_AGENT_PACKAGE_NAME=dprime-agent \
          PRIME_AGENT_CMD=dprime-agent \
          npm run release:pack -- \
            --channel beta \
            --version "$package_version" \
            --base-url "$release_base_url" \
            --artifact-base-url "$release_base_url" \
            --out-dir "$pack_dir"

          mkdir -p "$release_dir"
          cp -a "$pack_dir/artifacts" "$release_dir/"

          package_name="dprime-agent-${package_version}.tgz"
          package_sha256=$(sha256sum "$release_dir/artifacts/$package_name" | awk '{print $1}')
          printf 'commit=%s\npackage=%s\nsha256=%s\n' \
            "$BUILD_SHA" "$package_name" "$package_sha256" \
            > "$release_dir/dprime-agent-main.env"

          echo "RELEASE_DIR=$release_dir" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=$package_name" >> "$GITHUB_ENV"
          echo "RELEASE_BASE_URL=$release_base_url" >> "$GITHUB_ENV"

      - name: Upload Node packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: dprime-agent-main
        run: |
          printf 'DPrime Agent Node package candidate from `main` at `%s`.\n' \
            "$GITHUB_SHA" > "$RUNNER_TEMP/dprime-agent-release-notes.md"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "DPrime Agent main" \
              --notes-file "$RUNNER_TEMP/dprime-agent-release-notes.md" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "DPrime Agent main" \
              --notes-file "$RUNNER_TEMP/dprime-agent-release-notes.md" \
              --prerelease
          fi

          gh release upload "$RELEASE_TAG" "$RELEASE_DIR"/artifacts/*.tgz --clobber

      - name: Smoke test published Node package
        run: |
          smoke_dir="$RUNNER_TEMP/dprime-agent-smoke"
          npm install --prefix "$smoke_dir" --omit=dev "$RELEASE_BASE_URL/$PACKAGE_NAME"
          "$smoke_dir/node_modules/.bin/dprime-agent" --help >/dev/null
          node -e '
          const { createRequire } = require("node:module");
          const { join } = require("node:path");
          const requireFromPackage = createRequire(join(process.argv[1], "node_modules", "dprime-agent", "package.json"));
          const { Dealer } = requireFromPackage("zeromq");
          const socket = new Dealer();
          socket.close();
          ' "$smoke_dir"

      - name: Publish moving main manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: dprime-agent-main
        run: |
          printf 'Latest verified DPrime Agent Node package from `main` at `%s`.\n' \
            "$GITHUB_SHA" > "$RUNNER_TEMP/dprime-agent-release-notes.md"
          gh release edit "$RELEASE_TAG" \
            --title "DPrime Agent main" \
            --notes-file "$RUNNER_TEMP/dprime-agent-release-notes.md" \
            --prerelease
          gh release upload "$RELEASE_TAG" "$RELEASE_DIR/dprime-agent-main.env" --clobber

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
              -F sha="$GITHUB_SHA" \
              -F force=true >/dev/null
          fi

          release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .id)
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" \
            --jq ".[] | select(.name != \"$PACKAGE_NAME\" and .name != \"prime-agent-ai-${PACKAGE_NAME#dprime-agent-}\" and .name != \"prime-agent-core-${PACKAGE_NAME#dprime-agent-}\" and .name != \"prime-agent-tui-${PACKAGE_NAME#dprime-agent-}\" and .name != \"dprime-agent-main.env\") | .id" |
            while read -r asset_id; do
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            done
